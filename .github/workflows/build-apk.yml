name: Build & Release QuickTalk Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build QuickTalk APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickTalk-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: QuickTalk Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ### QuickTalk Native Android APK Release
            **Inspiration from Quick Share to make a chatting application without internet for quick talk with file sharing inside the chat.**
            
            #### Highlights:
            - 📡 100% Offline peer-to-peer messaging via Google Nearby Connections (BLE + Wi-Fi Direct).
            - 📁 Lossless offline photo and document file transfer without compression.
            - ⚡ Fast QR code camera pairing handshake.
            - ⏱ Disappearing messages with configurable self-destruct timers.
            - 🖤 Minimalist Black & White aesthetic with Satoshi / General Sans typography.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
